services:
  db:
    image: postgres:16
    container_name: finance-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: _ldji1333101Ldji1333101
      POSTGRES_DB: financecontrol
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financecontrol"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    image: node:20-alpine
    container_name: finance-dev-backend
    working_dir: /app
    command: sh -c "npm install && npm run start:dev"
    environment:
      HOST: db
      PORT: 5432
      NAMEUSER: postgres
      PASSWORD: _ldji1333101Ldji1333101
      DATABASE: financecontrol
      JWT_SECRET: VERY VERY SECRET KEY
      JWT_EXPIRES: 86400
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: finance-dev-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      API_TARGET: "http://backend:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata-dev:
  backend_node_modules:
  frontend_node_modules:
