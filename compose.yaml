services:
  db:
    image: postgres:16
    container_name: finance-track-db
    restart: unless-stopped
    env_file:
      - ./postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance-track-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finance-track-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
