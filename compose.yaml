services:
  db:
    image: postgres:16
    container_name: finance-track-db
    restart: unless-stopped
    env_file:
      - ./postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance-track-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:3000"
    healthcheck:
      # TCP check: backend listens on 3000 inside container
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Normal domain frontend (base=/)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE: "/"
    container_name: finance-track-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # IP path frontend for http://<ip>/app/finance (base=/app/finance/)
  frontend_appfinance:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE: "/app/finance/"
    container_name: finance-track-frontend-appfinance
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
